<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IoT Device Onboard</title>

  <!-- Bootstrap CDN (you prefer Bootstrap) -->
  <link rel="stylesheet" href="../static/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-3">IoT Device — Onboard</h3>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                  {{ msg }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" id="onboardForm" novalidate>
              <div class="mb-3 row">
                <div class="col">
                  <label class="form-label">Device Name *</label>
                  <input required name="device_name" type="text" class="form-control" value="{{ form.device_name or '' }}" placeholder="Pi1">
                </div>
                <div class="col">
                  <label class="form-label">Nick Name</label>
                  <input name="nick_name" type="text" class="form-control" value="{{ form.nick_name or '' }}" placeholder="Station 1 - Camera">
                </div>
              </div>

              <div class="mb-3 row">
                <div class="col">
                  <label class="form-label">Position</label>
                  <input name="position" type="text" class="form-control" value="{{ form.position or '' }}" placeholder="Line-1 Station-2">
                </div>
                <div class="col">
                  <label class="form-label">User ID</label>
                  <input name="user_id" type="text" class="form-control" value="{{ form.user_id or '' }}" placeholder="E123">
                </div>
              </div>

              <div class="mb-3 row">
                <div class="col">
                  <label class="form-label">IP</label>
                  <input name="ip" type="text" class="form-control" value="{{ form.ip or '' }}" placeholder="10.231.7.232">
                </div>
                <div class="col">
                  <label class="form-label">MAC</label>
                  <input name="mac" type="text" class="form-control" value="{{ form.mac or '' }}" placeholder="AA:BB:CC:DD:EE:FF">
                </div>
              </div>

              <div class="mb-3 row">
                <div class="col">
                  <label class="form-label">Model</label>
                  <input name="model" type="text" class="form-control" value="{{ form.model or '' }}" placeholder="GB11">
                </div>
                <div class="col">
                  <label class="form-label">Stage</label>
                  <input name="stage" type="number" class="form-control" value="{{ form.stage or '' }}" placeholder="1" min="0">
                </div>
                <div class="col">
                  <label class="form-label">Subtask</label>
                  <input name="subtask" type="number" class="form-control" value="{{ form.subtask or '' }}" placeholder="5" min="0">
                </div>
              </div>

              <div class="mb-3 row">
                <div class="col">
                  <label class="form-label">Password (optional)</label>
                  <input name="password" type="password" class="form-control" value="" placeholder="Optional device UI password">
                </div>
                <div class="col">
                  <label class="form-label">SSID</label>
                  <input name="ssid" type="text" class="form-control" value="{{ form.ssid or '' }}" placeholder="FactoryNet">
                </div>
                <div class="col">
                  <label class="form-label">SSID Key</label>
                  <input name="ssid_key" type="text" class="form-control" value="{{ form.ssid_key or '' }}" placeholder="wifiPassword">
                </div>
              </div>

              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">Onboard Device</button>
              </div>
            </form>

            <hr class="my-3">

            <p class="text-muted small">Fields marked with * are required. MAC and Device Name must be unique.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="../static/bootstrap-5.3.8-dist/bootstrap.bundle.min.js"></script>

  <script>
    // simple client-side required validation
    (function () {
      'use strict'
      const form = document.getElementById('onboardForm')
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
          form.classList.add('was-validated')
        }
      }, false)
    })()
  </script>
</body>
</html>
