<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Human-in-Loop Approval</title>
    <link rel="stylesheet" href="../static/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0" style="border-radius: 16px;">
            <div class="card-header bg-danger text-white border-0" style="border-radius: 16px 16px 0 0;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Task Failed – Human Review Required
            </div>

            <div class="card-body text-center p-4">
                <div id="imageSection" class="mb-3">
                    <img id="taskImage" src="" class="img-fluid rounded border" style="max-height: 420px;">
                </div>

                <p class="fw-semibold">
                    O-Ring quantity mismatch detected.
                </p>

                <p>Do you want to send this task for <strong>Human-in-Loop Approval</strong>?</p>

                <!-- Email Dropdown -->
                <div class="mb-3 text-start">
                    <label for="approverEmail" class="form-label fw-semibold">
                        <i class="bi bi-person-check me-1"></i>Select Approver
                    </label>
                    <select id="approverEmail" class="form-select">
                        <option value="">-- Choose approver --</option>
                        {% for email in approver_emails %}
                        <option value="{{ email }}">{{ email }}</option>
                        {% endfor %}
                    </select>
                </div>
                <P>{{approval_url}}</P>
                <div class="d-grid gap-2 mt-3">
                    <button id="sendApprovalBtn" class="btn btn-warning">
                        <i class="bi bi-send me-1"></i>Send for Human Approval
                    </button>

                    <button id="retryBtn" class="btn btn-secondary">
                        <i class="bi bi-arrow-clockwise me-1"></i>Retry Task
                    </button>
                </div>

                <div id="statusBox" class="alert alert-info mt-3 d-none"></div>
            </div>
        </div>
      </div>
    </div>
</div>

<script>
    window.APPROVAL_URL = "{{ approval_url }}";
    window.RETRY_URL = "{{ retry_url }}";
    window.IMAGE_URL = "{{ image_blob_url }}";
</script>

<script src="{{ url_for('static', filename='js/approval_hil.js') }}"></script>
</body>
</html>
