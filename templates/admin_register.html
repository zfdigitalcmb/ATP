{% extends "base.html" %}
{% block content %}
<div class="container py-5" style="max-width: 400px;">
  <h3 class="mb-3 text-center">Admin Registration</h3>
  <form method="post">
    <div class="mb-3">
      <label>Full Name</label>
      <input name="full_name" class="form-control" />
    </div>
    <div class="mb-3">
      <label>Username</label>
      <input name="username" class="form-control" required />
    </div>
    <div class="mb-3">
      <label>Email</label>
      <input name="email" type="email" class="form-control" />
    </div>
    <div class="mb-3">
      <label>Password</label>
      <input name="password" type="password" class="form-control" required />
    </div>
    <div class="mb-3">
      <label>Confirm Password</label>
      <input name="confirm" type="password" class="form-control" required />
    </div>
    <button class="btn btn-success w-100">Register</button>
  </form>
  <p class="mt-3 text-center small">
    Already registered? <a href="{{ url_for('admin_auth.login_admin') }}">Login</a>
  </p>
</div>
{% endblock %}
